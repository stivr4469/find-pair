version: '3.1'

services:
  nginx2:
    container_name: nginx2
    image: nginx:latest
    ports:
      - "8280:80"
    volumes:
      - ./vhost.conf:/etc/nginx/conf.d/default.conf
      - ./www:/var/www/public_html
    networks:
      - ng_php_mysql
    depends_on:
      - php2
      - mysql2

  php2:
    container_name: php2
    build: ./images/php
    volumes:
      - ./www:/var/www/public_html
    networks:
      - ng_php_mysql
    depends_on:
      - mysql2

  mysql2:
    container_name: mysql2
    image: mysql
    restart: always
    ports:
      - "3307:3306"  
    environment:
     - MYSQL_ROOT_PASSWORD=root
    volumes:
     - mysql_data3:/var/lib/mysql
    networks:
      - ng_php_mysql

  phpmyadmin2:
    container_name: phpmyadmin2
    image: phpmyadmin/phpmyadmin:latest               #login root pswd root
    environment:
      - PMA_HOST=mysql2                               # wordpress root root
    ports:
      - "1500:80"
    depends_on:
      - mysql2
    networks:
      - ng_php_mysql

networks:
  ng_php_mysql:
    name: ng_php_mysql
    external: true

volumes:
  mysql_data3:
  wordpress:
