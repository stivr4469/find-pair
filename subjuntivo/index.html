<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#FBF6EF" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#14110F" media="(prefers-color-scheme: dark)">
    <title>Subjuntivo · VamoS</title>
    <script>(function(){try{var t=localStorage.getItem('vamos:theme');if(t)document.documentElement.dataset.theme=t}catch(e){}}());</script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&family=Unbounded:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/unified-styles.css?v=32">
    <style>
      :root { --sj: #9333EA; }
      [data-theme="dark"] { --sj: #C084FC; }

      /* Список тем */
      .sj-subtitle { font-size: 0.82rem; color: var(--muted); margin-bottom: 14px; }
      .sj-all-btn {
        display: block; width: 100%;
        background: var(--sj); color: #fff; border: none;
        border-radius: var(--radius); padding: 14px;
        font: 700 1rem var(--font); cursor: pointer;
        margin-bottom: 14px;
        transition: opacity 0.2s, transform 0.2s var(--spring);
      }
      .sj-all-btn:hover { opacity: 0.9; transform: translateY(-1px); }
      .sj-all-btn:active { transform: scale(0.98); }
      .sj-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
      @media (max-width: 460px) { .sj-grid { grid-template-columns: 1fr; } }

      .sj-card {
        background: var(--surface); border: 1px solid var(--border);
        border-radius: var(--radius); padding: 14px;
        cursor: pointer; box-shadow: var(--shadow);
        transition: transform 0.25s var(--spring), border-color 0.2s;
      }
      .sj-card:hover { transform: translateY(-2px); border-color: color-mix(in srgb, var(--sj) 35%, var(--border)); }
      .sj-card:active { transform: scale(0.97); }
      .sj-tag { font-size: 0.65rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; padding: 2px 8px; border-radius: 999px; display: inline-block; margin-bottom: 6px; }
      .sj-card-name { font-weight: 700; font-size: 0.92rem; line-height: 1.3; }
      .sj-card-count { font-size: 0.75rem; color: var(--muted); margin-top: 4px; }

      /* Карточка темы */
      .sj-card-nav { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; }
      .sj-card-nav-num { font-size: 0.78rem; color: var(--muted); flex: 1; text-align: center; }
      .sj-card-title { font-size: 1.25rem; font-weight: 800; margin: 8px 0 4px; }
      .sj-rule {
        background: color-mix(in srgb, var(--sj) 8%, var(--surface));
        border-left: 3px solid var(--sj);
        border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
        padding: 13px 15px; margin: 14px 0;
        white-space: pre-line; font-size: 0.9rem; line-height: 1.65;
      }
      .sj-examples { margin-bottom: 20px; }
      .sj-example {
        font-style: italic; color: var(--muted); font-size: 0.87rem;
        margin-bottom: 5px; padding-left: 10px;
        border-left: 2px solid var(--faint); line-height: 1.5;
      }

      /* Квиз */
      .sj-qnum { font-size: 0.78rem; color: var(--muted); margin-bottom: 12px; }
      .sj-question { font-size: 1.02rem; font-weight: 600; line-height: 1.5; margin-bottom: 18px; }
      .sj-options { display: flex; flex-direction: column; gap: 10px; }
      .sj-option { text-align: left; }
      .sj-option:not([disabled]):hover { border-color: var(--sj); background: color-mix(in srgb, var(--sj) 8%, transparent); }
      .sj-option:not([disabled]):active { transform: scale(0.98); }
      .sj-option.correct, .sj-tile.correct { opacity: 1; }
      .sj-option.incorrect, .sj-tile.incorrect { opacity: 1; }

      .sj-fill-box {
        font-size: 1rem; font-weight: 600; line-height: 1.9;
        background: var(--faint); padding: 12px 16px; border-radius: var(--radius-sm);
        margin-bottom: 10px;
      }
      .sj-blank {
        display: inline-block; min-width: 70px;
        border-bottom: 2px solid var(--sj); color: var(--sj);
        font-weight: 700; padding: 0 4px; text-align: center;
      }
      .sj-sent-ru { font-size: 0.83rem; color: var(--muted); margin-bottom: 8px; }
      .sj-verb-label { font-size: 0.8rem; color: var(--sj); font-weight: 700; margin-bottom: 12px; }
      .sj-tiles { display: flex; flex-wrap: wrap; gap: 8px; }
      .sj-tile {
        background: var(--surface); border: 1.5px solid var(--border);
        border-radius: 999px; padding: 9px 20px;
        font: 700 0.95rem var(--font); color: var(--text); cursor: pointer;
        transition: border-color 0.15s, background 0.15s, transform 0.15s;
      }
      .sj-tile:not([disabled]):hover { border-color: var(--sj); background: color-mix(in srgb, var(--sj) 8%, transparent); }
      .sj-tile:not([disabled]):active { transform: scale(0.97); }
      .sj-tile.correct { border-color: var(--success); background: rgba(34,197,94,0.12); color: var(--success); font-weight: 800; }
      .sj-tile.incorrect { border-color: var(--danger); background: rgba(239,68,68,0.10); color: var(--danger); }

      .sj-hint {
        background: var(--faint); border-radius: var(--radius-sm);
        padding: 12px 14px; font-size: 0.85rem; color: var(--muted);
        white-space: pre-line; line-height: 1.6; margin-top: 14px;
      }

      /* Результаты */
      .sj-results { text-align: center; padding-top: 20px; }
      .sj-res-icon { font-size: 3.2rem; margin: 0 0 8px; }
      .sj-res-score { font-size: 2.5rem; font-weight: 800; color: var(--sj); margin-bottom: 6px; }
      .sj-res-label { font-size: 0.9rem; color: var(--muted); margin-bottom: 24px; }
    </style>
</head>
<body>
    <div class="back-button-container">
        <a href="../" class="back-button">← Главная</a>
        <button id="btn-back-to-list" class="back-button" style="display:none"
                onclick="SubjuntivoApp.backToList()">← Темы</button>
        <button id="theme-toggle" onclick="toggleTheme()"></button>
    </div>

    <header class="se-topbar">
        <h1 class="se-topbar-title"><b>Subjuntivo</b></h1>
        <div class="se-topbar-stats">
            <div class="se-stat-pill">
                <span class="dot dot-purple"></span>
                <span id="streak-value">0</span>
            </div>
            <div class="se-stat-pill">
                <span id="score-value">0</span>
                <span class="se-stat-label">очк.</span>
            </div>
        </div>
    </header>
    <div class="se-progress-bar-wrap">
        <div class="se-progress-bar-track">
            <div id="se-progress-fill" class="se-progress-fill"></div>
        </div>
    </div>

    <div id="buddy" style="max-width:760px;margin:0 auto;padding:0 16px"></div>

    <main id="sj-content" class="game-area"></main>

    <script src="../js/utils.js?v=25"></script>
    <script src="../js/naranjito.js?v=3"></script>
    <script src="../js/orange-throw.js?v=10"></script>
    <script src="data.js?v=2"></script>
    <script src="ui.js?v=5"></script>
    <script src="app.js?v=4"></script>
</body>
</html>
