<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tren Ir/Venir/Llegar</title>
    <!-- Anti-FOUC: применяем сохранённую тему до загрузки CSS -->
    <script>(function(){try{var t=localStorage.getItem('vamos:theme');if(t)document.documentElement.dataset.theme=t}catch(e){}}());</script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/unified-styles.css?v=15">
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    <style>
        .main-menu { max-width: 700px; }
        .mode-button { min-height: 80px; }
    </style>
</head>
<body>
    <!-- Кнопка назад в главное меню -->
    <div class="back-button-container">
        <a href="../" class="back-button">← Главная</a>
        <button id="btn-back-to-modes" class="back-button" style="display:none" onclick="App.showMainMenu()">← Режимы</button>
        <button id="theme-toggle" onclick="toggleTheme()" title="Сменить тему" aria-label="Сменить тему"></button>
    </div>

    <header class="se-topbar">
        <h1 class="se-topbar-title"><b>Тренажёр</b></h1>
        <div class="se-topbar-stats">
            <div class="se-stat-pill">🔥 <span id="streak-value">0</span></div>
            <div class="se-stat-pill"><span id="score-value">0</span> <span class="se-stat-label">очк.</span></div>
        </div>
    </header>
    <div class="se-progress-bar-wrap">
        <div class="se-progress-bar-track">
            <div id="se-progress-fill" class="se-progress-fill"></div>
        </div>
    </div>

    <!-- Mascot Naranjito -->
    <div id="buddy" style="max-width:760px;margin:0 auto;padding:0 16px"></div>

    <!-- Меню principal con 5 botones de mode -->
    <nav class="main-menu">
        <button id="mode0-btn" class="mode-button" data-mode="mode0" onclick="App.switchMode('mode0')">
            Базовое спряжение
        </button>
        <button id="mode1-btn" class="mode-button" data-mode="mode1" onclick="App.switchMode('mode1')">
            Выбор глагола
        </button>
        <button id="mode2-btn" class="mode-button" data-mode="mode2" onclick="App.switchMode('mode2')">
            Спряжение
        </button>
        <button id="mode3-btn" class="mode-button" data-mode="mode3" onclick="App.switchMode('mode3')">
            Предлоги
        </button>
        <button id="mode4-btn" class="mode-button" data-mode="mode4" onclick="App.switchMode('mode4')">
            Перевод
        </button>
        <button id="mode5-btn" class="mode-button" data-mode="mode5" onclick="App.switchMode('mode5')">
            Контекст
        </button>
        <button id="mode6-btn" class="mode-button" data-mode="mode6" onclick="App.switchMode('mode6')">
            Inline выбор
        </button>
        <button id="mode7-btn" class="mode-button" data-mode="mode7" onclick="App.switchMode('mode7')">
            Распредели слова
        </button>
    </nav>

    <!-- Игровая зона для режима 1: Выбор глагола -->
    <main id="mode1-area" class="game-area hidden">
        <h2>🎯 Выбор глагола</h2>
        <div id="mode1-content">
            <!-- Сюда будет рендериться UI из mode1-ui.js -->
        </div>
    </main>

    <!-- Результаты Mode 1 -->
    <main id="mode1-results" class="game-area hidden">
        <h2>🏁 Результаты</h2>
        <div id="mode1-final-score" class="final-score"></div>
        <div id="mode1-message" class="final-message"></div>
        <button onclick="restartMode1()" class="restart-button">🔄 Ещё раз</button>
        <button onclick="showMainMenu()" class="menu-button">📋 Меню</button>
    </main>

    <!-- Игровая зона для режима 2: Спряжение -->
    <main id="mode0-area" class="game-area hidden">
        <h2>📝 Базовое спряжение</h2>
        <div id="mode0-content" class="mode-content">
            <!-- Контент будет загружаться динамически -->
        </div>
    </main>

    <!-- Игровая зона для режима 2: Спряжение -->
    <main id="mode2-area" class="game-area hidden">
        <h2>📝 Спряжение</h2>
        <div id="mode2-content" class="mode-content">
            <!-- Контент загружается динамически -->
        </div>
    </main>

    <!-- Игровая зона для режима 3: Предлоги -->
    <main id="mode3-area" class="game-area hidden">
        <h2>📝 Предлоги</h2>
        <div id="mode3-content">
            <!-- Сюда будет рендериться UI из mode3-ui.js -->
        </div>
    </main>

    <!-- Игровая зона для режима 4: Перевод -->
    <main id="mode4-area" class="game-area hidden">
        <h2>🌐 Перевод</h2>
        <div id="mode4-content">
            <!-- Сюда будет рендериться UI из mode4-ui.js -->
        </div>
    </main>

    <!-- Игровая зона для режима 5: Контекст -->
    <main id="mode5-area" class="game-area hidden">
        <h2>🌐 Контекст</h2>
        <div id="mode5-content" class="mode-content">
            <!-- Контент загружается динамически -->
            <p>Загрузка...</p>
        </div>
    </main>

    <!-- Игровая зона для режима 6: Inline выбор -->
    <main id="mode6-area" class="game-area hidden">
        <h2>✏️ Inline выбор</h2>
        <div id="mode6-content">
            <!-- Сюда будет рендериться UI из mode6-ui.js -->
        </div>
    </main>

    <!-- Игровая зона для режима 7: Распредели слова -->
    <main id="mode7-area" class="game-area hidden">
        <h2>🗂️ Распредели слова</h2>
        <div id="mode7-content">
            <!-- Сюда будет рендериться UI из mode7-ui.js -->
        </div>
    </main>

    <!-- Footer с индикатором прогресса -->
    <footer class="app-footer">
        <div id="progress-indicator" class="progress">
            <span id="progress-label">Прогресс:</span>
            <span id="progress-value">0%</span>
        </div>
    </footer>

    <!-- Подключение скриптов -->
    <script src="../js/utils.js?v=18"></script>
    <script src="mode2-data.js?v=10"></script>
    <script src="mode1-data.js?v=10"></script>
    <script src="mode3-data.js?v=10"></script>
    <script src="mode4-data.js?v=10"></script>
    <script src="mode5-data.js?v=10"></script>
    <script src="mode6-data.js?v=10"></script>
    <script src="mode7-data.js?v=10"></script>
    <script src="mode0-game.js?v=11"></script>
    <script src="mode0-options.js?v=10"></script>
    <script src="mode0-results.js?v=10"></script>
    <script src="mode0-ui.js?v=11"></script>
    <script src="mode1-ui.js?v=10"></script>
    <script src="mode2-ui.js?v=10"></script>
    <script src="mode3-ui.js?v=10"></script>
    <script src="mode4-ui.js?v=10"></script>
    <script src="mode5-ui.js?v=11"></script>
    <script src="mode6-ui.js?v=10"></script>
    <script src="mode7-ui.js?v=10"></script>
    <script src="mode0.js?v=10"></script>
    <script src="mode1.js?v=11"></script>
    <script src="mode2.js?v=11"></script>
    <script src="mode3.js?v=11"></script>
    <script src="mode4.js?v=11"></script>
    <script src="mode5.js?v=11"></script>
    <script src="mode6.js?v=11"></script>
    <script src="mode7.js?v=10"></script>
    <script src="../js/naranjito.js?v=1"></script>
    <script src="app.js?v=12"></script>
    <script>lucide.createIcons();</script>
</body>
</html>
