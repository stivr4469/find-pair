<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Найди пару</title>
    <!-- Anti-FOUC: применяем сохранённую тему до загрузки CSS -->
    <script>(function(){try{var t=localStorage.getItem('vamos:theme');if(t)document.documentElement.dataset.theme=t}catch(e){}}());</script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/unified-styles.css?v=29">
    <link rel="stylesheet" href="styles.css?v=4">
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
</head>
<body>
    <!-- Кнопка назад в главное меню -->
    <div class="back-button-container">
        <a href="../" class="back-button">← Главная</a>
        <button id="theme-toggle" onclick="toggleTheme()" title="Сменить тему" aria-label="Сменить тему"></button>
    </div>

    <header class="se-topbar">
        <h1 class="se-topbar-title"><b>Найди пару</b></h1>
        <div class="se-topbar-stats">
            <div class="se-stat-pill"><span class="dot dot-orange" style="margin-right:2px"></span><span id="streak-value">0</span></div>
            <div class="se-stat-pill"><span id="score-value">0</span> <span class="se-stat-label">очк.</span></div>
        </div>
    </header>
    <div class="se-progress-bar-wrap">
        <div class="se-progress-bar-track">
            <div id="se-progress-fill" class="se-progress-fill"></div>
        </div>
    </div>

    <div class="container">

        <!-- Настройки игры в одной строке -->
        <div class="game-settings">
            <div class="setting-item">
                <label for="category-select">Категория:</label>
                <select id="category-select" onchange="initGame()">
                    <option value="verbs">Глаголы</option>
                    <option value="nouns">Существительные</option>
                    <option value="adjectives">Прилагательные</option>
                    <option value="adverbs">Наречия</option>
                </select>
            </div>

            <div class="setting-item">
                <label for="pair-count">Количество пар:</label>
                <select id="pair-count" onchange="initGame()">
                    <option value="5">5</option>
                    <option value="10">10</option>
                    <option value="15">15</option>
                    <option value="20">20</option>
                </select>
            </div>
        </div>

        <div class="columns">
            <div id="left-column" class="column left-column"></div>
            <div id="right-column" class="column right-column"></div>
        </div>

        <!-- Кнопка для начала новой игры -->
        <button id="restart-button" class="restart-button" onclick="initGame()">Начать заново</button>
    </div>

    <script src="../js/utils.js?v=25"></script>
    <script src="script.js?v=6"></script>
    <script>lucide.createIcons();</script>
</body>
</html>
