<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ser vs Estar</title>
    <!-- Anti-FOUC: применяем сохранённую тему до загрузки CSS -->
    <script>(function(){try{var t=localStorage.getItem('vamos:theme');if(t)document.documentElement.dataset.theme=t}catch(e){}}());</script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/unified-styles.css?v=25">
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    <style>
        /* ── Naranjito над карточкой ── */
        #buddy { --nj-h: 150px; }

        /* ── Кнопка "Дальше" фиксирована внизу ── */
        #context-next-btn {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 50;
            min-width: 220px;
        }

        /* Отступ снизу чтобы контент не прятался за fixed-кнопку */
        #ser-estar-context-area {
            padding-bottom: 80px;
        }

        /* ── Fill-blank: tiles ── */
        .ctx-sentence {
            line-height: 1.6;
        }
        .ctx-tiles {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin-top: 4px;
        }
        .ctx-tile {
            padding: 10px 28px;
            border-radius: 20px;
            border: 2px solid var(--border);
            background: var(--surface);
            color: var(--text);
            font-size: 1.15rem;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            transition: border-color 0.18s, background 0.18s, transform 0.15s;
            line-height: 1.3;
        }
        .ctx-tile:hover:not(:disabled) {
            border-color: var(--accent);
            background: var(--accent-faint);
            color: var(--accent);
            transform: scale(1.06);
        }
        .ctx-tile:disabled {
            cursor: not-allowed;
            opacity: 0.75;
        }
        .ctx-tile.correct {
            border-color: #27ae60 !important;
            background: #d4edda !important;
            color: #155724 !important;
        }
        .ctx-tile.incorrect {
            border-color: #e74c3c !important;
            background: #f8d7da !important;
            color: #721c24 !important;
        }

        /* ── Context mode question card ── */
        .ctx-question-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 28px 24px 24px;
            max-width: 700px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .ctx-progress-label {
            font-size: 0.68rem;
            font-weight: 600;
            letter-spacing: 0.09em;
            text-transform: uppercase;
            color: var(--muted);
            text-align: center;
        }
        .ctx-question-text {
            font-size: 2rem;
            font-weight: 700;
            line-height: 1.3;
            letter-spacing: -0.03em;
            color: var(--text);
            text-align: center;
        }
        .ctx-blank {
            color: var(--accent);
            text-decoration: underline;
            text-underline-offset: 4px;
            text-decoration-thickness: 2px;
            letter-spacing: 0.01em;
        }
        .ctx-translation {
            font-size: 0.95rem;
            color: var(--muted);
            text-align: center;
            font-style: italic;
        }
    </style>
</head>
<body>
    <!-- Кнопка назад -->
    <div class="back-button-container">
        <a href="../" class="back-button">← Главная</a>
        <button id="btn-back-to-modes" class="back-button" style="display:none" onclick="SerEstarApp.showMainMenu()">← Режимы</button>
        <button id="theme-toggle" onclick="toggleTheme()" title="Сменить тему" aria-label="Сменить тему"></button>
    </div>

    <!-- Compact top bar -->
    <header class="se-topbar">
        <h1 class="se-topbar-title"><b>Ser</b> <span class="se-vs">vs</span> <b>Estar</b></h1>
        <div class="se-topbar-stats">
            <div class="se-stat-pill"><span class="dot dot-orange" style="margin-right:2px"></span><span id="streak-value">0</span></div>
            <div class="se-stat-pill"><span id="score-value">0</span> <span class="se-stat-label">очк.</span></div>
        </div>
    </header>
    <div class="se-progress-bar-wrap">
        <div class="se-progress-bar-track">
            <div id="se-progress-fill" class="se-progress-fill"></div>
        </div>
    </div>

    <!-- Главное меню Ser/Estar - 4 режима -->
    <nav class="main-menu">
        <button class="mode-button" data-mode="base">
            <span class="dot dot-blue"></span> Базовое спряжение
        </button>
        <button class="mode-button" data-mode="advanced">
            <span class="dot dot-orange"></span> Продвинутое спряжение
        </button>
        <button class="mode-button" data-mode="context">
            <span class="dot dot-green"></span> Контекст
        </button>
        <button class="mode-button" data-mode="rules">
            <span class="dot dot-purple"></span> Правила (DOCTOR/PLACE)
        </button>
        <button class="mode-button" data-mode="classify">
            <span class="dot dot-teal"></span> Классификация
        </button>
    </nav>

    <!-- Mascot Naranjito — прямо над карточкой -->
    <div id="buddy" style="max-width:760px;margin:0 auto;padding:0 16px"></div>

    <!-- Mode Base (A1): Базовое спряжение -->
    <main id="ser-estar-base-area" class="game-area hidden">
        <!-- Контент загружается динамически -->
    </main>

    <!-- Mode Advanced (A2): Продвинутое спряжение -->
    <main id="ser-estar-advanced-area" class="game-area hidden" style="padding-bottom: 80px;">
        <h2>Продвинутое спряжение</h2>
        <div class="progress-text">Вопрос <span id="ser-estar-mode2-progress">1</span> из 10</div>
        <div class="verb-info" id="ser-estar-mode2-verb-info"></div>
        <div class="options-container" id="ser-estar-mode2-options"></div>
        <div class="feedback" id="ser-estar-mode2-feedback"></div>
        <button id="ser-estar-mode2-next-btn" class="next-button quiz-next-fixed" style="display: none;">Дальше →</button>
    </main>

    <!-- Mode Context (A2): Контекст -->
    <main id="ser-estar-context-area" class="game-area hidden">
        <!-- Контент для контекстного режима -->
    </main>

    <!-- Page: Rules (DOCTOR/PLACE) -->
    <main id="ser-estar-rules-area" class="game-area hidden">
        <!-- Контент для страницы правил -->
    </main>

    <!-- Mode Classify: Классификация SER/ESTAR -->
    <main id="ser-estar-classify-area" class="game-area hidden">
        <!-- Контент загружается динамически через classify-ui.js -->
    </main>

    <!-- Footer -->
    <footer class="app-footer">
        <p>Ser vs Estar • Тренажёр испанских глаголов</p>
    </footer>

    <!-- Scripts -->
    <script src="../js/naranjito.js?v=3"></script>
    <script src="../js/utils.js?v=21"></script>
    <script src="ser-estar-data.js"></script>
    <script src="ser-estar-base-ui.js?v=3"></script>
    <script src="ser-estar-base-mode.js?v=2"></script>
    <script src="ser-estar-context-ui.js?v=7"></script>
    <script src="ser-estar-context-mode.js?v=2"></script>
    <script src="ser-estar-rules-data.js?v=1"></script>
    <script src="ser-estar-rules-ui.js?v=4"></script>
    <script src="ser-estar-rules-mode.js"></script>
    <script src="ser-estar-mode2.js?v=6"></script>
    <script src="classify-data.js"></script>
    <script src="classify-ui.js?v=9"></script>
    <script src="classify-mode.js?v=4"></script>
    <script src="ser-estar-app.js?v=4"></script>
    <script src="../js/orange-throw.js?v=6"></script>
    <script>lucide.createIcons();</script>
</body>
</html>
