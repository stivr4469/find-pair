<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ser vs Estar</title>
    <!-- Anti-FOUC: применяем сохранённую тему до загрузки CSS -->
    <script>(function(){try{var t=localStorage.getItem('vamos:theme');if(t)document.documentElement.dataset.theme=t}catch(e){}}());</script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/unified-styles.css?v=14">
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    <style>
        /* ── Context mode question card ── */
        .ctx-question-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 28px 24px 24px;
            max-width: 560px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .ctx-progress-label {
            font-size: 0.68rem;
            font-weight: 600;
            letter-spacing: 0.09em;
            text-transform: uppercase;
            color: var(--muted);
            text-align: center;
        }
        .ctx-question-text {
            font-size: 2rem;
            font-weight: 700;
            line-height: 1.3;
            color: var(--text);
            text-align: center;
        }
        .ctx-blank {
            color: var(--accent);
            text-decoration: underline;
            text-underline-offset: 4px;
            text-decoration-thickness: 2px;
            letter-spacing: 0.05em;
        }
        .ctx-translation {
            font-size: 0.95rem;
            color: var(--muted);
            text-align: center;
            font-style: italic;
        }
    </style>
</head>
<body>
    <!-- Кнопка назад -->
    <div class="back-button-container">
        <a href="../" class="back-button">← Главная</a>
        <button id="btn-back-to-modes" class="back-button" style="display:none" onclick="SerEstarApp.showMainMenu()">← Режимы</button>
        <button id="theme-toggle" onclick="toggleTheme()" title="Сменить тему" aria-label="Сменить тему"></button>
    </div>

    <!-- Header -->
    <header class="app-header">
        <h1><span class="app-header-icon" style="background:linear-gradient(135deg,#dbeafe,#bfdbfe)"><i data-lucide="git-branch" style="stroke:#2563eb"></i></span>Ser vs Estar</h1>
        <p>Научись различать два глагола "to be"</p>
    </header>

    <!-- Главное меню Ser/Estar - 4 режима -->
    <nav class="main-menu">
        <button class="mode-button" data-mode="base">
            📝 Базовое спряжение
        </button>
        <button class="mode-button" data-mode="advanced">
            ⚙️ Продвинутое спряжение
        </button>
        <button class="mode-button" data-mode="context">
            🎯 Контекст
        </button>
        <button class="mode-button" data-mode="rules">
            📚 Правила (DOCTOR/PLACE)
        </button>
        <button class="mode-button" data-mode="classify">
            🃏 Классификация
        </button>
    </nav>

    <!-- Счет -->
    <section class="score-display">
        <span>Счет:</span>
        <span id="score-value">0</span>
    </section>

    <!-- Mode Base (A1): Базовое спряжение -->
    <main id="ser-estar-base-area" class="game-area hidden">
        <!-- Контент загружается динамически -->
    </main>

    <!-- Mode Advanced (A2): Продвинутое спряжение -->
    <main id="ser-estar-advanced-area" class="game-area hidden">
        <h2>⚙️ Продвинутое спряжение</h2>
        <div class="progress-text">Вопрос <span id="ser-estar-mode2-progress">1</span> из 10</div>
        <div class="verb-info" id="ser-estar-mode2-verb-info"></div>
        <div class="options-container" id="ser-estar-mode2-options"></div>
        <div class="feedback" id="ser-estar-mode2-feedback"></div>
        <button id="ser-estar-mode2-next-btn" class="next-button" style="display: none;">Дальше →</button>
    </main>

    <!-- Mode Context (A2): Контекст -->
    <main id="ser-estar-context-area" class="game-area hidden">
        <!-- Контент для контекстного режима -->
    </main>

    <!-- Page: Rules (DOCTOR/PLACE) -->
    <main id="ser-estar-rules-area" class="game-area hidden">
        <!-- Контент для страницы правил -->
    </main>

    <!-- Mode Classify: Классификация SER/ESTAR -->
    <main id="ser-estar-classify-area" class="game-area hidden">
        <!-- Контент загружается динамически через classify-ui.js -->
    </main>

    <!-- Footer -->
    <footer class="app-footer">
        <p>Ser vs Estar • Тренажёр испанских глаголов</p>
    </footer>

    <!-- Scripts -->
    <script src="../js/utils.js?v=18"></script>
    <script src="ser-estar-data.js"></script>
    <script src="ser-estar-base-ui.js"></script>
    <script src="ser-estar-base-mode.js?v=1"></script>
    <script src="ser-estar-context-ui.js?v=4"></script>
    <script src="ser-estar-context-mode.js?v=2"></script>
    <script src="ser-estar-rules-ui.js?v=2"></script>
    <script src="ser-estar-rules-mode.js"></script>
    <script src="ser-estar-mode2.js?v=4"></script>
    <script src="classify-data.js"></script>
    <script src="classify-ui.js?v=6"></script>
    <script src="classify-mode.js?v=3"></script>
    <script src="ser-estar-app.js"></script>
    <script>lucide.createIcons();</script>
</body>
</html>
