<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🎭 Ser vs Estar</title>
    <link rel="stylesheet" href="../css/unified-styles.css?v=9">
</head>
<body>
    <!-- Кнопка назад -->
    <div class="back-button-container">
        <a href="../" class="back-button">← Назад в меню</a>
    </div>

    <!-- Header -->
    <header class="app-header">
        <h1>🎭 Ser vs Estar</h1>
        <p>Научись различать два глагола "to be"</p>
    </header>

    <!-- Главное меню Ser/Estar - 2 новых режима -->
    <nav class="main-menu">
        <button class="mode-button" data-mode="base">
            📝 Базовое спряжение (A1)
        </button>
        <button class="mode-button" data-mode="advanced">
            ⚙️ Продвинутое спряжение (A2)
        </button>
    </nav>

    <!-- Счет -->
    <section class="score-display">
        <span>Счет:</span>
        <span id="score-value">0</span>
    </section>

    <!-- Mode Base (A1): Базовое спряжение -->
    <main id="ser-estar-base-area" class="game-area hidden">
        <!-- Контент загружается динамически -->
    </main>

    <!-- Mode Advanced (A2): Продвинутое спряжение -->
    <main id="ser-estar-advanced-area" class="game-area hidden">
        <!-- Контент загружается динамически -->
    </main>
    <!-- Footer -->
    <footer class="app-footer">
        <p>Ser vs Estar • Тренажёр испанских глаголов</p>
    </footer>

    <!-- Scripts -->
    <script src="ser-estar-data.js"></script>
    <script src="ser-estar-base-ui.js"></script>
    <script src="ser-estar-base-mode.js"></script>
    <script src="ser-estar-mode2.js"></script>
    <script src="ser-estar-app.js"></script>
</body>
</html>
