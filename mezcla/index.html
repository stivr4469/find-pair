<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mezcla — смешанное чтение</title>
    <link rel="stylesheet" href="../css/unified-styles.css?v=13">
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    <style>
        .mezcla-main {
            width: 100%;
            max-width: 760px;
            margin: 0 auto;
            padding: 0 16px 80px;
        }
    </style>
</head>
<body>
    <div class="back-button-container">
        <a href="../" class="back-button">← Главная</a>
    </div>

    <header class="app-header">
        <h1><span class="app-header-icon" style="background:linear-gradient(135deg,#e0e7ff,#c7d2fe)"><i data-lucide="shuffle" style="stroke:#4f46e5"></i></span>Mezcla</h1>
    </header>

    <main id="mezcla-content" class="mezcla-main"></main>

    <footer class="app-footer">
        <p>Регулируй процент испанских слов и читай на своём уровне</p>
    </footer>

    <script src="../js/utils.js?v=17"></script>
    <script src="data.js?v=1"></script>
    <script src="ui.js?v=6"></script>
    <script src="app.js?v=6"></script>
    <script>lucide.createIcons();</script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            if (typeof MezclaApp !== 'undefined') {
                MezclaApp.init();
            }
        });
    </script>
</body>
</html>
