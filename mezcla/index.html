<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mezcla — смешанное чтение</title>
    <!-- Anti-FOUC: применяем сохранённую тему до загрузки CSS -->
    <script>(function(){try{var t=localStorage.getItem('vamos:theme');if(t)document.documentElement.dataset.theme=t}catch(e){}}());</script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/unified-styles.css?v=20">
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    <style>
        .mezcla-main {
            width: 100%;
            max-width: 760px;
            margin: 0 auto;
            padding: 0 16px 80px;
        }
    </style>
</head>
<body>
    <div class="back-button-container">
        <a href="../" class="back-button">← Главная</a>
        <button id="theme-toggle" onclick="toggleTheme()" title="Сменить тему" aria-label="Сменить тему"></button>
    </div>

    <header class="se-topbar">
        <h1 class="se-topbar-title"><b>Mezcla</b></h1>
        <div class="se-topbar-stats">
            <div class="se-stat-pill"><span class="dot dot-orange" style="margin-right:2px"></span><span id="streak-value">0</span></div>
            <div class="se-stat-pill"><span id="score-value">0</span> <span class="se-stat-label">очк.</span></div>
        </div>
    </header>
    <div class="se-progress-bar-wrap">
        <div class="se-progress-bar-track">
            <div id="se-progress-fill" class="se-progress-fill"></div>
        </div>
    </div>

    <main id="mezcla-content" class="mezcla-main"></main>

    <footer class="app-footer">
        <p>Регулируй процент испанских слов и читай на своём уровне</p>
    </footer>

    <script src="../js/utils.js?v=20"></script>
    <script src="data.js?v=1"></script>
    <script src="ui.js?v=10"></script>
    <script src="app.js?v=8"></script>
    <script>lucide.createIcons();</script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            if (typeof MezclaApp !== 'undefined') {
                MezclaApp.init();
            }
        });
    </script>
</body>
</html>
