<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>36 Формул испанского</title>
    <!-- Anti-FOUC: применяем сохранённую тему до загрузки CSS -->
    <script>(function(){try{var t=localStorage.getItem('vamos:theme');if(t)document.documentElement.dataset.theme=t}catch(e){}}());</script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/unified-styles.css?v=29">
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    <style>
        .formulas-main {
            width: 100%;
            max-width: 760px;
            margin: 0 auto;
            padding: 0 16px 80px;
        }
        .formula-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 12px;
            margin: 16px 0;
        }
        .formula-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 14px 10px;
            cursor: pointer;
            text-align: center;
            transition: transform 0.15s, background 0.15s, border-color 0.15s;
            color: var(--text);
            box-shadow: var(--shadow);
        }
        .formula-card:hover {
            background: var(--faint);
            border-color: var(--accent);
            transform: translateY(-2px);
        }
        .formula-card-emoji {
            font-size: 1.6rem;
            display: block;
            margin-bottom: 6px;
        }
        .formula-card-num {
            font-size: 0.7rem;
            opacity: 0.6;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .formula-card-name {
            font-size: 0.85rem;
            font-weight: 600;
            margin: 4px 0 2px;
        }
        .formula-card-rule {
            font-size: 0.72rem;
            opacity: 0.65;
            font-style: italic;
        }
        /* Detail card */
        .formula-detail {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
            margin: 16px 0;
            color: var(--text);
            box-shadow: var(--shadow);
        }
        .formula-detail-header {
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 12px;
        }
        .formula-rule-box {
            background: var(--faint);
            border-left: 3px solid var(--accent);
            border-radius: 8px;
            padding: 10px 14px;
            font-family: monospace;
            font-size: 0.95rem;
            margin: 12px 0;
            color: var(--text);
        }
        .formula-example-main {
            font-size: 1.3rem;
            font-weight: 600;
            margin: 10px 0 4px;
        }
        .formula-example-ru {
            font-size: 0.9rem;
            color: var(--muted);
            margin-bottom: 12px;
        }
        .formula-examples-list {
            list-style: none;
            padding: 0;
            margin: 8px 0 16px;
        }
        .formula-examples-list li {
            padding: 6px 0;
            border-bottom: 1px solid var(--border);
            font-size: 0.9rem;
        }
        .formula-examples-list li span {
            display: block;
            color: var(--muted);
            font-size: 0.8rem;
        }
        .formula-nav-btns {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 16px;
        }
        .btn-secondary {
            background: var(--faint);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px 16px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: background 0.15s;
            font-family: var(--font);
        }
        .btn-secondary:hover { background: var(--accent-faint); border-color: var(--accent); }
        .btn-primary {
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 10px 20px;
            font-size: 0.9rem;
            font-weight: 700;
            cursor: pointer;
            transition: opacity 0.15s;
            font-family: var(--font);
        }
        .btn-primary:hover { opacity: 0.88; }
        /* Quiz */
        .quiz-header {
            margin-bottom: 16px;
            color: var(--muted);
            font-size: 0.9rem;
        }
        .quiz-formula-badge {
            display: inline-block;
            background: var(--accent-faint);
            border-radius: 20px;
            padding: 4px 12px;
            font-size: 0.8rem;
            margin-bottom: 10px;
            color: var(--accent);
        }
        .quiz-question {
            font-size: 1.3rem;
            font-weight: 700;
            margin: 12px 0 20px;
            line-height: 1.4;
            color: var(--text);
        }
        .quiz-options {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 16px;
        }
        .quiz-option {
            background: var(--surface);
            border: 1.5px solid var(--border);
            border-radius: 10px;
            padding: 12px 16px;
            text-align: left;
            color: var(--text);
            font-size: 0.95rem;
            cursor: pointer;
            transition: background 0.15s, border-color 0.15s;
            display: flex;
            align-items: center;
            gap: 10px;
            font-family: var(--font);
        }
        .quiz-option:hover:not(:disabled) {
            background: var(--accent-faint);
            border-color: var(--accent);
        }
        .quiz-option:disabled { cursor: default; }
        .quiz-option.correct {
            background: rgba(22,163,74,0.15);
            border-color: #16A34A;
        }
        .quiz-option.wrong {
            background: rgba(220,38,38,0.12);
            border-color: #DC2626;
        }
        .quiz-option-letter {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            background: var(--faint);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.8rem;
            flex-shrink: 0;
            color: var(--muted);
        }
        .quiz-hint {
            background: var(--faint);
            border-radius: 8px;
            padding: 10px 14px;
            font-size: 0.85rem;
            margin: 10px 0;
            color: var(--text);
        }
        .quiz-results {
            text-align: center;
            padding: 32px 16px;
        }
        .quiz-results-emoji { font-size: 3rem; margin-bottom: 12px; }
        .quiz-results-score { font-size: 2rem; font-weight: 700; margin-bottom: 8px; color: var(--text); }
        .quiz-results-pct { font-size: 1rem; color: var(--muted); margin-bottom: 24px; }
        .all-quiz-btn {
            width: 100%;
            background: var(--faint);
            border: 2px dashed var(--border);
            border-radius: 12px;
            padding: 16px;
            color: var(--text);
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 16px;
            transition: background 0.15s, border-color 0.15s;
            font-family: var(--font);
        }
        .all-quiz-btn:hover { background: var(--accent-faint); border-color: var(--accent); }
        @media (max-width: 480px) {
            .formula-grid { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px; }
            .quiz-question { font-size: 1.1rem; }
        }
    </style>
</head>
<body>
    <!-- Кнопка назад в главное меню -->
    <div class="back-button-container">
        <a href="../" class="back-button">← Главная</a>
        <button id="btn-back-to-list" class="back-button" style="display:none" onclick="FormulasApp.backToList()">← Список</button>
        <button id="theme-toggle" onclick="toggleTheme()" title="Сменить тему" aria-label="Сменить тему"></button>
    </div>

    <header class="se-topbar">
        <h1 class="se-topbar-title"><b>36 Формул</b></h1>
        <div class="se-topbar-stats">
            <div class="se-stat-pill"><span class="dot dot-orange" style="margin-right:2px"></span><span id="streak-value">0</span></div>
            <div class="se-stat-pill"><span id="score-value">0</span> <span class="se-stat-label">очк.</span></div>
        </div>
    </header>
    <div class="se-progress-bar-wrap">
        <div class="se-progress-bar-track">
            <div id="se-progress-fill" class="se-progress-fill"></div>
        </div>
    </div>

    <!-- Mascot: Naranjito -->
    <div id="buddy" style="max-width:760px;margin:0 auto;padding:0 16px"></div>

    <!-- Основной контент -->
    <main id="formulas-content" class="formulas-main game-area"></main>

    <!-- Футер -->
    <footer class="app-footer">
        <p>Нажми на формулу чтобы изучить правило и пройти тест</p>
    </footer>

    <!-- Скрипты -->
    <style>
        /* ── XP Counter ─────────────────────────────────────────────────────── */
        #xp-counter {
            position: fixed;
            top: 14px;
            right: 14px;
            z-index: 9999;
            background: var(--accent);
            color: #fff;
            font-weight: 700;
            font-size: 0.82rem;
            padding: 6px 14px;
            border-radius: 999px;
            box-shadow: 0 3px 12px rgba(242,107,29,0.45);
            display: flex;
            align-items: center;
            gap: 5px;
            user-select: none;
            transition: transform 0.15s;
        }
        #xp-counter.bump {
            animation: xp-bump 0.3s ease;
        }
        @keyframes xp-bump {
            0%   { transform: scale(1); }
            50%  { transform: scale(1.22); }
            100% { transform: scale(1); }
        }
        .xp-float {
            position: fixed;
            z-index: 10000;
            font-weight: 700;
            font-size: 0.95rem;
            color: var(--accent);
            pointer-events: none;
            white-space: nowrap;
            text-shadow: 0 1px 4px rgba(0,0,0,0.18);
            animation: xp-float-up 0.9s ease forwards;
        }
        @keyframes xp-float-up {
            0%   { opacity: 1; transform: translateY(0) scale(1); }
            60%  { opacity: 1; transform: translateY(-28px) scale(1.15); }
            100% { opacity: 0; transform: translateY(-48px) scale(0.9); }
        }
    </style>
    <!-- XP Counter widget -->
    <div id="xp-counter"><i data-lucide="zap" style="width:14px;height:14px;stroke:#fff"></i> <span id="xp-value">0</span> XP</div>

    <script src="../js/utils.js?v=25"></script>
    <script src="data.js?v=17"></script>
    <script src="ui.js?v=31"></script>
    <script src="../js/naranjito.js?v=3"></script>
    <script src="app.js?v=20"></script>
    <script src="../js/orange-throw.js?v=7"></script>
    <script>lucide.createIcons();</script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            if (typeof FormulasApp !== 'undefined') {
                FormulasApp.init();
            }
        });
    </script>
</body>
</html>
